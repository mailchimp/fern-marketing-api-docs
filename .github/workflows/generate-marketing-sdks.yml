name: generate-marketing-sdks

# Manually generate the Mailchimp Marketing API SDKs. Each group opens a
# pull request on its fern-demo/mailchimp-<lang>-sdk repo (mode: pull-request).
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which SDK group to generate"
        type: choice
        default: all
        options:
          - all
          - typescript-sdk
          - python-sdk
          - go-sdk
          - java-sdk
          - csharp-sdk
          - php-sdk
          - ruby-sdk
          - swift-sdk
          - rust-sdk

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.group }}" = "all" ]; then
            echo 'matrix=["typescript-sdk","python-sdk","go-sdk","java-sdk","csharp-sdk","php-sdk","ruby-sdk","swift-sdk","rust-sdk"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.group }}"]' >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Fern CLI tool
        uses: fern-api/setup-fern-cli@v1

      - name: Generate ${{ matrix.group }}
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --api mailchimp-openapi --group ${{ matrix.group }} --log-level debug
