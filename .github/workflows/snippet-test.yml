name: snippet-test

# TEMPORARY: verify whether a *versioned* SDK generation registers the snippet
# data that the docs API reference renders. Uses the pull-request group (no
# registry publish, no release tag) but passes --version. Delete after testing.
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: fern-api/setup-fern-cli@v1
      - name: Versioned generate (typescript)
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --api mailchimp-openapi --group typescript-sdk --version 0.1.0 --retry-rate-limited --log-level debug
