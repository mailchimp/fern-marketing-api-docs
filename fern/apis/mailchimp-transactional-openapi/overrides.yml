# OpenAPI overrides for Mailchimp Transactional API
# (Group names are cleaned by renaming tags in openapi.json — Fern ignores
#  tag x-displayName for API-reference group labels.)
# - Shorten a handful of long/awkward endpoint titles for the side nav.

paths:
  /messages/send:
    post:
      summary: Send a message
  /messages/send-template:
    post:
      summary: Send using a template
  /messages/send-raw:
    post:
      summary: Send a raw message
  /messages/info:
    post:
      summary: Get message info
  /messages/content:
    post:
      summary: Get message content
  /messages/search-time-series:
    post:
      summary: Search time series
  /users/info:
    post:
      summary: Get account info
  /users/ping:
    post:
      summary: Ping
  /users/ping2:
    post:
      summary: Ping (strict JSON)
  /users/senders:
    post:
      summary: List account senders
  /mctemplates/info:
    post:
      summary: Get template info
  /mctemplates/list:
    post:
      summary: List templates
  /mctemplates/render:
    post:
      summary: Render template
  /mctemplates/time-series:
    post:
      summary: Get template time series
  /rejects/add-sms:
    post:
      summary: Add SMS to denylist
  /rejects/delete:
    post:
      summary: Remove from blacklist
  /rejects/delete-sms:
    post:
      summary: Remove SMS from denylist
  /rejects/list-sms:
    post:
      summary: List SMS denylist
  /senders/info:
    post:
      summary: Get sender info
  /tags/info:
    post:
      summary: Get tag info
  /tags/time-series:
    post:
      summary: Get tag time series
  /exports/whitelist:
    post:
      summary: Export allowlist (legacy)

# --- Response typing fixes (tighten loose schemas -> concrete SDK types) ---
# The source spec models InboundSendRawResponse as oneOf[typed array, {untyped
# "null" branch}]. The untyped branch makes generators fall back to a loose type
# (`unknown` in TS, `mixed` in PHP) — and PHP unions it to the illegal
# `mixed|null` at InboundClient::sendRaw(), which breaks the PHP build. Replace
# the oneOf with the single typed array branch so every SDK emits a concrete
# return type (a nullable array of matched-route results).
components:
  schemas:
    InboundSendRawResponse:
      description: >-
        Array of processing results showing matched routes (empty or absent when
        no recipients are processed or the message is invalid).
      # Fern overrides merge oneOf element-wise, so we re-state both branches:
      # [0] the typed array of matched-route results, and [1] the "no results"
      # branch retyped from an untyped object (-> `unknown`/`mixed`) to an
      # explicit `null`, yielding a clean nullable array in every SDK.
      oneOf:
        - type: array
          items:
            type: object
            required:
              - email
              - pattern
              - url
            properties:
              email:
                type: string
                format: email
                description: The email address that was processed.
              pattern:
                type: string
                description: The route pattern that matched this email.
              url:
                type: string
                format: uri
                description: The webhook URL where this message was sent.
        - type: "null"
