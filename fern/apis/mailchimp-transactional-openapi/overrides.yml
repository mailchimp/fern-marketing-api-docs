# OpenAPI overrides for Mailchimp Transactional API
# (Group names are cleaned by renaming tags in openapi.json — Fern ignores
#  tag x-displayName for API-reference group labels.)
# - Shorten a handful of long/awkward endpoint titles for the side nav.

# --- Command/section group names (x-fern-sdk-group-name) -------------------
# Upstream's tag names are terse acronyms ("IPs", "MC Templates", "URLs").
# These were previously fixed by renaming the tags inside openapi.json, which
# meant the fix was silently lost the moment the spec was re-vendored (PR #54):
# the CLI kebab-cased the raw acronyms into `i-ps`, `m-c-templates` and
# `u-r-ls`. Pinning the group explicitly per operation puts the fix in the
# overlay where it survives every future sync.
#
# Fern ignores tag `x-displayName` for API-reference group labels, so the tag
# name itself is not a usable lever - hence per-operation group names, the same
# mechanism the Marketing workspace uses (see ../mailchimp-openapi/group-names.yml).
#
#   upstream tag      -> group id
#   IPs               -> dedicated-ips
#   MC Templates      -> mailchimp-templates
#   URLs              -> tracking-domains
#   (the other 12 tags map to their lowercased name)
#
# Also carries the endpoint `summary` overrides that were already here, so the
# side-nav titles are unchanged.
