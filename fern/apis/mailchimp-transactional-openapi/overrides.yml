# OpenAPI overrides for Mailchimp Transactional API
# (Group names are cleaned by renaming tags in openapi.json — Fern ignores
#  tag x-displayName for API-reference group labels.)
# - Shorten a handful of long/awkward endpoint titles for the side nav.

paths:
  /messages/send:
    post:
      summary: Send a message
  /messages/send-template:
    post:
      summary: Send using a template
  /messages/send-raw:
    post:
      summary: Send a raw message
  /messages/info:
    post:
      summary: Get message info
  /messages/content:
    post:
      summary: Get message content
  /messages/search-time-series:
    post:
      summary: Search time series
  /users/info:
    post:
      summary: Get account info
  /users/ping:
    post:
      summary: Ping
  /users/ping2:
    post:
      summary: Ping (strict JSON)
  /users/senders:
    post:
      summary: List account senders
  /mctemplates/info:
    post:
      summary: Get template info
  /mctemplates/list:
    post:
      summary: List templates
  /mctemplates/render:
    post:
      summary: Render template
  /mctemplates/time-series:
    post:
      summary: Get template time series
  /rejects/add-sms:
    post:
      summary: Add SMS to denylist
  /rejects/delete:
    post:
      summary: Remove from blacklist
  /rejects/delete-sms:
    post:
      summary: Remove SMS from denylist
  /rejects/list-sms:
    post:
      summary: List SMS denylist
  /senders/info:
    post:
      summary: Get sender info
  /tags/info:
    post:
      summary: Get tag info
  /tags/time-series:
    post:
      summary: Get tag time series
  /exports/whitelist:
    post:
      summary: Export allowlist (legacy)

# --- Response typing fixes (tighten loose schemas -> concrete SDK types) ---
# The source spec models InboundSendRawResponse as oneOf[typed array, {untyped
# "null" branch}]. The untyped branch makes generators fall back to a loose type
# (`unknown` in TS, `mixed` in PHP) — and PHP unions it to the illegal
# `mixed|null` at InboundClient::sendRaw(), which breaks the PHP build. Replace
# the oneOf with the single typed array branch so every SDK emits a concrete
# return type (a nullable array of matched-route results).
components:
  schemas:
    InboundSendRawResponse:
      description: >-
        Array of processing results showing matched routes (empty or absent when
        no recipients are processed or the message is invalid).
      # Fern overrides merge oneOf element-wise, so we re-state both branches:
      # [0] the typed array of matched-route results, and [1] the "no results"
      # branch retyped from an untyped object (-> `unknown`/`mixed`) to an
      # explicit `null`, yielding a clean nullable array in every SDK.
      oneOf:
        - type: array
          items:
            type: object
            required:
              - email
              - pattern
              - url
            properties:
              email:
                type: string
                format: email
                description: The email address that was processed.
              pattern:
                type: string
                description: The route pattern that matched this email.
              url:
                type: string
                format: uri
                description: The webhook URL where this message was sent.
        - type: "null"

    # --- Conformance fixes from the Mandrill real-account SDK test pass ---
    # (2026-08-31 findings doc; every item below reproduced against a live
    #  account in at least one language.)
    #
    # NOTE ON `format: null`: Fern's override merge is a deep merge, so a key
    # present in the source spec cannot be dropped by omitting it here — it has
    # to be explicitly nulled. Verified against `fern ir`: omitting `format`
    # leaves the field as DATE_TIME; `format: null` correctly yields a string.

    # 1. users/ping2 returns {"PING":"PONG!"}, but the source schema declares a
    #    `const` object with no `type`, so the converter falls back to string —
    #    every SDK types this as a bare string and fails to decode the real
    #    response (`type UsersPing2Response = string` in the Go SDK today).
    #    Clear the const and state the object shape explicitly.
    UsersPing2Response:
      description: Static JSON payload confirming the API is reachable.
      const: null
      type: object
      required:
        - PING
      properties:
        PING:
          type: string
          enum:
            - PONG!
          description: Always the literal string "PONG!".
      example:
        PING: PONG!

    # 2. Datetime format. Mandrill emits `YYYY-MM-DD HH:MM:SS`, space-separated,
    #    with optional fractional seconds and an empty string for "not yet set".
    #    That is not RFC3339, so `format: date-time` makes Go/Rust fail to parse
    #    real responses and makes Go/Rust/Python serialize `send_at` in a format
    #    the API rejects with HTTP 500.
    #
    #    25 comparable fields in this spec are already annotated the correct way
    #    (`type: string` + pattern) and none of them failed the test pass. These
    #    20 are the stragglers still on `format: date-time`; this brings them in
    #    line with the rest of the spec.
    Sender:
      properties:
        created_at: &mandrill-datetime
          type: string
          format: null
          pattern: "^$|^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}(\\.\\d+)?$"
    SendersHourStat:
      properties:
        time: *mandrill-datetime
    SendersSenderDomain:
      properties:
        created_at: *mandrill-datetime
        last_tested_at: *mandrill-datetime
        verified_at: *mandrill-datetime
    VerificationDetail:
      properties:
        valid_after: *mandrill-datetime
    TemplatesTemplateHistory:
      properties:
        time: *mandrill-datetime
    MessagesSendRequest:
      allOf:
        - {}
        - properties:
            send_at: *mandrill-datetime
    MessagesSendTemplateRequest:
      allOf:
        - {}
        - properties:
            send_at: *mandrill-datetime
    MessagesSendRawRequest:
      allOf:
        - {}
        - properties:
            send_at: *mandrill-datetime
    MessagesSendMcTemplateRequest:
      allOf:
        - {}
        - properties:
            send_at: *mandrill-datetime
    MessagesRescheduleRequest:
      allOf:
        - {}
        - properties:
            send_at: *mandrill-datetime

    # 3. Fields typed required/non-nullable that real responses omit or null out.
    #    `draft_updated_at` was absent from 7 of 60+ real templates, so it is a
    #    missing key (-> optional), not a null value (-> nullable). The `required`
    #    arrays are restated in full because array merges are element-wise.
    MctemplatesMcTemplate:
      required:
        - mc_template_id
        - mc_template_name
        - labels
        - code
        - subject
        - from_email
        - from_name
        - text
        - publish_code
        - publish_text
        - published_at
        - created_at
        - updated_at
        - is_broken_template
      properties:
        published_at:
          type:
            - string
            - "null"
          format: null
          pattern: "^$|^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}(\\.\\d+)?$"
        created_at: *mandrill-datetime
        updated_at: *mandrill-datetime
        draft_updated_at: *mandrill-datetime
    TemplatesTemplate:
      required:
        - slug
        - name
        - labels
        - code
        - subject
        - from_email
        - from_name
        - text
        - publish_name
        - publish_code
        - publish_subject
        - publish_from_email
        - publish_from_name
        - publish_text
        - published_at
        - created_at
        - updated_at
        - is_broken_template
      properties:
        published_at:
          type:
            - string
            - "null"
          format: null
          pattern: "^$|^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}(\\.\\d+)?$"
        created_at: *mandrill-datetime
        updated_at: *mandrill-datetime
        draft_updated_at: *mandrill-datetime

    # `valid_mx` is null until the domain's MX records have been checked.
    InboundDomain:
      properties:
        valid_mx:
          type:
            - boolean
            - "null"

    # `expires_at` is null on permanent (non-expiring) denylist entries.
    RejectsListResponse:
      items:
        properties:
          expires_at:
            type:
              - string
              - "null"

    # `detail` is null on allowlist entries added without a comment.
    AllowlistsListResponse:
      items:
        properties:
          detail:
            type:
              - string
              - "null"

    # 4. messages/info omits `diag` entirely when there is no delivery
    #    diagnostic yet. It is declared required and non-nullable, so the
    #    MessagesEmailInfo / MessagesSmsInfo union can match neither arm and the
    #    Ruby SDK silently returns an untyped Hash instead of the typed model.
    #    Make it optional (absent) and nullable (explicitly null).
    MessagesSmtpEvent:
      required:
        - ts
        - type
        - source_ip
        - destination_ip
        - size
      properties:
        diag:
          type:
            - string
            - "null"
