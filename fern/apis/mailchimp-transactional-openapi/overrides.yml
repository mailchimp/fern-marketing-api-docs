components:
  schemas:
    InboundSendRawResponse:
      description: Array of processing results showing matched routes (empty or absent when no recipients are processed
        or the message is invalid).
      oneOf:
      - type: array
        items:
          type: object
          required:
          - email
          - pattern
          - url
          properties:
            email:
              type: string
              format: email
              description: The email address that was processed.
            pattern:
              type: string
              description: The route pattern that matched this email.
            url:
              type: string
              format: uri
              description: The webhook URL where this message was sent.
      - type: 'null'
    UsersPing2Response:
      description: Static JSON payload confirming the API is reachable.
      const: null
      type: object
      required:
      - PING
      properties:
        PING:
          type: string
          enum:
          - PONG!
          description: Always the literal string "PONG!".
      example:
        PING: PONG!
    Sender:
      properties:
        created_at: &id001
          type: string
          format: null
          pattern: ^$|^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d+)?$
    SendersHourStat:
      properties:
        time: *id001
    SendersSenderDomain:
      properties:
        created_at: *id001
        last_tested_at: *id001
        verified_at: *id001
    VerificationDetail:
      properties:
        valid_after: *id001
    TemplatesTemplateHistory:
      properties:
        time: *id001
    MessagesSendRequest:
      allOf:
      - {}
      - properties:
          send_at: *id001
    MessagesSendTemplateRequest:
      allOf:
      - {}
      - properties:
          send_at: *id001
    MessagesSendRawRequest:
      allOf:
      - {}
      - properties:
          send_at: *id001
    MessagesSendMcTemplateRequest:
      allOf:
      - {}
      - properties:
          send_at: *id001
    MessagesRescheduleRequest:
      allOf:
      - {}
      - properties:
          send_at: *id001
    MctemplatesMcTemplate:
      required:
      - mc_template_id
      - mc_template_name
      - labels
      - code
      - subject
      - from_email
      - from_name
      - text
      - publish_code
      - publish_text
      - published_at
      - created_at
      - updated_at
      - is_broken_template
      properties:
        published_at:
          type:
          - string
          - 'null'
          format: null
          pattern: ^$|^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d+)?$
        created_at: *id001
        updated_at: *id001
        draft_updated_at: *id001
    TemplatesTemplate:
      required:
      - slug
      - name
      - labels
      - code
      - subject
      - from_email
      - from_name
      - text
      - publish_name
      - publish_code
      - publish_subject
      - publish_from_email
      - publish_from_name
      - publish_text
      - published_at
      - created_at
      - updated_at
      - is_broken_template
      properties:
        published_at:
          type:
          - string
          - 'null'
          format: null
          pattern: ^$|^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d+)?$
        created_at: *id001
        updated_at: *id001
        draft_updated_at: *id001
    InboundDomain:
      properties:
        valid_mx:
          type:
          - boolean
          - 'null'
    RejectsListResponse:
      items:
        properties:
          expires_at:
            type:
            - string
            - 'null'
    AllowlistsListResponse:
      items:
        properties:
          detail:
            type:
            - string
            - 'null'
    MessagesEmailInfo:
      allOf:
      - {}
      - {}
      - {}
      - required:
        - smtp_events
        - subaccount
        - resends
        - reject
    MessagesSmtpEvent:
      required:
      - ts
      - type
      - source_ip
      - destination_ip
      - size
      properties:
        diag:
          type:
          - string
          - 'null'
