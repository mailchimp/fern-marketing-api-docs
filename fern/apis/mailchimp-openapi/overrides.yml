info:
  description: |
    The Mailchimp Marketing API provides programmatic access to Mailchimp data and functionality.
    Use this API to manage audiences, campaigns, automations, and more.

    ## Authentication

    The API supports two authentication methods:

    - **API Key**: Use HTTP Basic authentication with any string as the username and your API key as the password. Alternatively, pass the API key as a Bearer token in the Authorization header.
    - **OAuth 2**: Use the OAuth 2 authorization code flow for integrations that access other users' accounts.

    ## Base URL

    All API requests use the format `https://api.mailchimp.com/3.0/`.

    ## Pagination

    List endpoints support offset-based pagination with `count` (max 1000) and `offset` query parameters. Responses include `total_items` to indicate the full result set size.

    ## Rate Limits

    The API enforces rate limits of 10 simultaneous connections. If you exceed this limit, you'll receive a `429 Too Many Requests` response.

# Auth schemes are declared in openapi.json directly (`basicAuth`, `oauth2`).
#
# Earlier the spec declared `bearerToken` + an override security block that
# Fern merged with the spec's `security` by array index. The result —
# `[{bearerToken, basicAuth}, {oauth2}]` — was an AND requirement no client
# could satisfy, and the generated CLI dropped the Authorization header
# entirely. Spec-level declaration of `security: [{basicAuth}, {oauth2}]`
# avoids the array-merge pitfall and matches Mailchimp's documented method
# (HTTP Basic with any username + API key as password).

# Replaces the raw export's `servers` array wholesale, which is deliberate and
# load-bearing for two reasons:
#
#   1. Every account uses the same host. The export has carried a templated
#      `https://{serverPrefix}.api.mailchimp.com` (us1..us22); there is no
#      per-datacenter host to select, so the single plain URL below is correct.
#   2. The export also ships an internal `https://dev.api.mailchimp.com`
#      labeled "Mailchimp development environment". Replacing the array is what
#      keeps that host out of the published docs and the generated SDKs. It
#      reappears in openapi.json on every re-vendor, so do not narrow this to a
#      merge or drop it — the dev host would become public.
servers:
  - description: Mailchimp public API
    url: https://api.mailchimp.com

