# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json

api:
  specs:
    - openapi: openapi.json
      overrides:
        # Base cleanup (tags, servers, auth, pagination) + the shared
        # method-name overrides (x-fern-sdk-method-name) so SDK methods read
        # idiomatically (lists.list(), lists.get-member()) instead of the raw
        # verb+path operationIds. The same file drives the CLI command names.
        - overrides.yml
        - ../mailchimp-cli/method-names.yml
        # Group every operation by its tag so the API reference nav organizes
        # endpoints into resource sections (not one flat expanded list).
        - group-names.yml

whitelabel:
  github:
    username: mc-keith
    email: keith@mailchimp.com
    token: ${WHITELABEL_TOKEN}
# Mailchimp Marketing API SDKs — one group per language.
# Each group publishes to its own fern-demo/mailchimp-<lang>-sdk repo as a
# reviewable PR (mode: pull-request). Auth (basic/oauth2), servers (us1..us22
# datacenter variable), and pagination are configured in overrides.yml.
# smart-casing keeps acronyms/initialisms/numbers idiomatic across all SDKs.
groups:
  cli:
    generators:
      - name: fern-cli-generator
        version: 0.39.4
        config:
          binaryName: mcapi
        github:
          repository: mailchimp/mailchimp-marketing-cli
          mode: pull-request
  typescript-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.88.3
        smart-casing: true
        output:
          location: npm
          package-name: "@mailchimp/mailchimp-marketing"
        github:
          repository: mailchimp/mailchimp-marketing-typescript-sdk
          mode: pull-request
        config:
          namespaceExport: Mailchimp
          allowCustomFetcher: true
          skipResponseValidation: true
          includeApiReference: true

  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.29.3
        smart-casing: true
        output:
          location: pypi
          package-name: mailchimp-marketing
        github:
          repository: mailchimp/mailchimp-marketing-python-sdk
          mode: pull-request
        config:
          package_name: mailchimp_marketing
          client_class_name: MailchimpClient

  go-sdk:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.57.10
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-go-sdk
          mode: pull-request
        config:
          clientName: MailchimpClient

  java-sdk:
    generators:
      - name: fernapi/fern-java-sdk
        version: 4.19.2
        smart-casing: true
        output:
          location: maven
          coordinate: com.mailchimp:mailchimp-marketing
        github:
          repository: mailchimp/mailchimp-marketing-java-sdk
          mode: pull-request
        config:
          client-class-name: MailchimpClient
          package-prefix: com.mailchimp.marketing

  csharp-sdk:
    generators:
      - name: fernapi/fern-csharp-sdk
        version: 2.83.2
        smart-casing: true
        output:
          location: nuget
          package-name: Mailchimp.Marketing
        github:
          repository: mailchimp/mailchimp-marketing-csharp-sdk
          mode: pull-request
        config:
          namespace: Mailchimp.Marketing
          client-class-name: MailchimpClient

  php-sdk:
    generators:
      - name: fernapi/fern-php-sdk
        version: 2.20.4
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-php-sdk
          mode: pull-request
        config:
          clientName: MailchimpClient
          packageName: mailchimp/marketing-sdk

  ruby-sdk:
    generators:
      - name: fernapi/fern-ruby-sdk
        version: 1.24.0
        smart-casing: true
        output:
          location: rubygems
          package-name: mailchimp-marketing
        github:
          repository: mailchimp/mailchimp-marketing-ruby-sdk
          mode: pull-request
        # NOTE: no moduleName override — setting it makes the generator name the
        # entry file after the module verbatim (lib/Mailchimp.rb) instead of
        # snake_case (lib/mailchimp.rb), which fails the generated rubocop
        # Naming/FileName lint. The gem name + repo already differentiate the two
        # Ruby SDKs. (Filed as an upstream generator bug.)

  swift-sdk:
    generators:
      - name: fernapi/fern-swift-sdk
        version: 0.36.1
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-swift-sdk
          mode: pull-request
        config:
          clientClassName: MailchimpClient
          moduleName: Mailchimp

  rust-sdk:
    generators:
      - name: fernapi/fern-rust-sdk
        version: 0.46.4
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-rust-sdk
          mode: pull-request
        config:
          crateName: mailchimp_marketing
          clientClassName: MailchimpClient

  # ===========================================================================
  # RELEASE GROUPS — publish to package registries (mode: release).
  # Parallel to the pull-request groups above (those stay the review/preview
  # flow). Triggered manually via .github/workflows/publish-sdks.yml.
  # Auth: OIDC trusted publishing where Fern supports it (npm/PyPI/NuGet);
  # tokens for Maven/RubyGems/crates; git-tag release for Go/Swift/PHP
  # (PHP also needs a Packagist webhook on the SDK repo). Not run until the
  # registry credentials/OIDC trust are configured.
  # ===========================================================================
  typescript-sdk-release:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.88.3
        smart-casing: true
        output:
          location: npm
          package-name: "@mailchimp/mailchimp-marketing"
          token: OIDC
        github:
          repository: mailchimp/mailchimp-marketing-typescript-sdk
          mode: release
        config:
          namespaceExport: Mailchimp
          allowCustomFetcher: true
          skipResponseValidation: true
          includeApiReference: true

  python-sdk-release:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.29.3
        smart-casing: true
        output:
          location: pypi
          package-name: mailchimp-marketing
          token: OIDC
        github:
          repository: mailchimp/mailchimp-marketing-python-sdk
          mode: release
        config:
          package_name: mailchimp_marketing
          client_class_name: MailchimpClient

  go-sdk-release:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.57.10
        smart-casing: true
        github:
          repository: fern-demo/mailchimp-go-sdk
          mode: release
        config:
          clientName: MailchimpClient

  java-sdk-release:
    generators:
      - name: fernapi/fern-java-sdk
        version: 4.19.2
        smart-casing: true
        output:
          location: maven
          coordinate: com.mailchimp:mailchimp-marketing
          username: ${MAVEN_USERNAME}
          password: ${MAVEN_PASSWORD}
          signature:
            keyId: ${MAVEN_SIGNATURE_SECRET_KEY_ID}
            password: ${MAVEN_SIGNATURE_PASSWORD}
            secretKey: ${MAVEN_SIGNATURE_SECRET_KEY}
        github:
          repository: mailchimp/mailchimp-marketing-java-sdk
          mode: release
        config:
          client-class-name: MailchimpClient
          package-prefix: com.mailchimp.marketing
          publish-to: central

  csharp-sdk-release:
    generators:
      - name: fernapi/fern-csharp-sdk
        version: 2.83.2
        smart-casing: true
        output:
          location: nuget
          package-name: Mailchimp.Marketing
          api-key: OIDC
        github:
          repository: mailchimp/mailchimp-marketing-csharp-sdk
          mode: release
        config:
          namespace: Mailchimp.Marketing
          client-class-name: MailchimpClient

  php-sdk-release:
    generators:
      - name: fernapi/fern-php-sdk
        version: 2.20.4
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-php-sdk
          mode: release
        config:
          clientName: MailchimpClient
          packageName: mailchimp/marketing-sdk

  ruby-sdk-release:
    generators:
      - name: fernapi/fern-ruby-sdk
        version: 1.24.0
        smart-casing: true
        output:
          location: rubygems
          package-name: mailchimp-marketing
          api-key: ${RUBYGEMS_API_KEY}
        github:
          repository: mailchimp/mailchimp-marketing-ruby-sdk
          mode: release

  swift-sdk-release:
    generators:
      - name: fernapi/fern-swift-sdk
        version: 0.36.1
        smart-casing: true
        github:
          repository: mailchimp/mailchimp-marketing-swift-sdk
          mode: release
        config:
          clientClassName: MailchimpClient
          moduleName: Mailchimp

  rust-sdk-release:
    generators:
      - name: fernapi/fern-rust-sdk
        version: 0.46.4
        smart-casing: true
        output:
          location: crates
          package-name: mailchimp_marketing
          token: ${CRATES_IO_API_KEY}
        github:
          repository: mailchimp/mailchimp-marketing-rust-sdk
          mode: release
        config:
          crateName: mailchimp_marketing
          clientClassName: MailchimpClient
