# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/product-yml.schema.json

# Header tabs (docs.yml layout.tabs-placement: header). Slugs live on the tab
# DEFINITIONS (not the `- tab:` nav items) so URLs stay /marketing,
# /marketing/concepts/*, /marketing/api-concepts/*, /marketing/build/*,
# /marketing/api/*.
#
# Reorganized 2026-08-21: replaces the previous Overview / Guides /
# Documentation / API Reference tabs. See notes/proposed-ia.md.
tabs:
  overview:
    # Leftmost tab. Its page is the full-bleed landing page and `skip-slug`
    # keeps it at the product root, so this tab is what serves /marketing.
    display-name: Overview
    skip-slug: true
  concepts:
    display-name: Mailchimp core concepts
    slug: concepts
  api-concepts:
    display-name: API core concepts
    slug: api-concepts
  building:
    display-name: Building with Mailchimp
    slug: build
  api:
    display-name: API Reference
    slug: api

# Every `section:` below sets `collapsible: true` + `collapsed-by-default: true`.
# A section with neither key renders as a permanently expanded heading, while
# API reference tag groups are always collapsible and closed until you are
# inside them — that mismatch is what made the left nav look half-open,
# half-closed. With these keys every group starts closed except the ancestors
# of the current page, which Fern always expands and which is not overridable.
navigation:
  - tab: overview
    layout:
      - page: Overview
        path: ../docs/pages/marketing/landing.mdx
        slug: ""

  # Domain concepts for a developer new to Mailchimp. No API mechanics.
  - tab: concepts
    layout:
      - page: How Mailchimp works
        path: ../docs/pages/concepts/how-mailchimp-works.mdx
        slug: how-mailchimp-works
      # Nested to mirror the data model: contacts, merge fields, and
      # segments all belong to an audience. Tags live on contacts, so they
      # are a section of the contacts page rather than a page of their own.
      - section: Audiences
        path: ../docs/pages/concepts/audiences/overview.mdx
        slug: audiences
        collapsible: true
        collapsed-by-default: true
        contents:
          - page: Contacts
            path: ../docs/pages/concepts/audiences/contacts.mdx
            slug: contacts
          - page: Merge fields
            path: ../docs/pages/concepts/audiences/merge-fields.mdx
            slug: merge-fields
          - page: Segments
            path: ../docs/pages/concepts/audiences/segments.mdx
            slug: segments
      - page: E-commerce
        path: ../docs/pages/concepts/e-commerce.mdx
        slug: e-commerce

  # Mechanics of the interface. Holds deep mechanism guides — for these
  # topics the mechanism IS the concept.
  - tab: api-concepts
    layout:
      - page: API structure
        path: ../docs/pages/api-concepts/api-structure.mdx
        slug: api-structure
      # Section, not a flat page: OAuth 2 is a kind of authentication, and
      # the parent owns the "which credential?" decision once. The OAuth
      # implementation walkthrough lives in Building -> Start developing.
      - section: Authentication
        path: ../docs/pages/api-concepts/authentication.mdx
        slug: authentication
        collapsible: true
        collapsed-by-default: true
        contents:
          - page: API keys
            path: ../docs/pages/api-concepts/authentication/api-keys.mdx
            slug: api-keys
          - page: OAuth 2
            path: ../docs/pages/api-concepts/authentication/oauth-2.mdx
            slug: oauth-2
      - page: Methods and parameters
        path: ../docs/pages/api-concepts/methods-and-parameters.mdx
        slug: methods-and-parameters
      - page: Rate limits and timeouts
        path: ../docs/pages/api-concepts/rate-limits-and-timeouts.mdx
        slug: rate-limits-and-timeouts
      - page: Errors
        path: ../docs/pages/api-concepts/errors.mdx
        slug: errors
      - page: Webhooks
        path: ../docs/pages/api-concepts/webhooks.mdx
        slug: webhooks
      - page: Batch operations
        path: ../docs/pages/api-concepts/batch-operations.mdx
        slug: batch-operations
      - page: Alternative schemas
        path: ../docs/pages/api-concepts/alternative-schemas.mdx
        slug: alternative-schemas
      - page: Audiences endpoints (beta)
        path: ../docs/pages/api-concepts/audiences-endpoints-beta.mdx
        slug: audiences-endpoints-beta
        availability: beta

  - tab: building
    layout:
      - section: Get started
        collapsible: true
        collapsed-by-default: true
        contents:
          - page: Create an account
            path: ../docs/pages/building/get-started/create-an-account.mdx
            slug: create-an-account
          - page: Generate your API key
            path: ../docs/pages/building/get-started/generate-your-api-key.mdx
            slug: generate-your-api-key

      # Complete, end-to-end tutorials of real, specific use cases.
      - section: Quickstarts
        collapsible: true
        collapsed-by-default: true
        contents:
          - page: Import and export contacts
            path: ../docs/pages/building/quickstarts/import-and-export-contacts.mdx
            slug: import-and-export-contacts
          - page: Organize contacts with tags
            path: ../docs/pages/building/quickstarts/organize-contacts-with-tags.mdx
            slug: organize-contacts-with-tags

      - section: Start developing
        collapsible: true
        collapsed-by-default: true
        contents:
          # Marketing-scoped SDK page. Deliberately NOT the shared
          # tools/landing.mdx, which is the cross-API Tools product and
          # includes Transactional libraries that are out of scope here.
          - page: Client libraries and SDKs
            path: ../docs/pages/building/start-developing/client-libraries-and-sdks.mdx
            slug: client-libraries-and-sdks
          - page: Send your first API request
            path: ../docs/pages/building/start-developing/send-your-first-api-request.mdx
            slug: send-your-first-api-request
          - page: CLI
            path: ../docs/pages/building/start-developing/cli.mdx
            slug: cli
          - page: Set up an OAuth app
            path: ../docs/pages/building/start-developing/set-up-an-oauth-app.mdx
            slug: set-up-an-oauth-app
          # Hidden from the sidebar (stakeholder, 2026-08-21): the Mobile SDK
          # is a platform-specific client, not a step on the onboarding path,
          # and it is already surfaced by Client libraries and SDKs, whose
          # iOS/Android cards now link here. Page stays live for search and
          # inbound links.
          - page: Mobile SDK
            path: ../docs/pages/building/start-developing/mobile-sdk.mdx
            slug: mobile-sdk
            hidden: true
          # Hidden from the sidebar: not launching this page yet (2026-09-16).
          - page: Go-live checklist
            path: ../docs/pages/building/start-developing/go-live-checklist.mdx
            slug: go-live-checklist
            hidden: true
          # Account exports is a live v3.0 endpoint (POST /3.0/account-exports).
          # Hidden from the sidebar because it is a reference/task page rather
          # than an onboarding step, not because it is legacy. The retired
          # Export API v1.0 that used to sit beside it was deleted 2026-08-24.
          - page: Account exports
            path: ../docs/pages/building/start-developing/account-exports.mdx
            slug: account-exports
            hidden: true

      # Slug pinned to `ai-tools` rather than the title-derived
      # `build-with-ai-tools`, which nested as /build/build-with-ai-tools and
      # stuttered. It also matches the page directory, so config, filesystem,
      # and URL agree. The overview is the section landing page (same pattern
      # as Audiences and Authentication), so it has no page entry of its own.
      - section: Build with AI tools
        path: ../docs/pages/building/ai-tools/overview.mdx
        slug: ai-tools
        collapsible: true
        collapsed-by-default: true
        contents:
          - page: MCP server
            path: ../docs/pages/building/ai-tools/mcp-server.mdx
            slug: mcp-server
          - page: Agent skills
            path: ../docs/pages/building/ai-tools/agent-skills.mdx
            slug: agent-skills
          - page: llms.txt
            path: ../docs/pages/building/ai-tools/llms-txt.mdx
            slug: llms-txt

  - tab: api
    layout:
      - api: API Reference
        api-name: mailchimp-openapi
        skip-slug: true
        paginated: true
        snippets:
          typescript: "@mailchimp/mailchimp-marketing"
          python: mailchimp-marketing
          go: https://github.com/mailchimp/mailchimp-marketing-go-sdk
          java: com.mailchimp:mailchimp-marketing
          csharp: Mailchimp.Marketing
          ruby: mailchimp-marketing
          php: mailchimp/marketing-sdk
        # Custom sections (Audiences, Automations, Campaigns, E-commerce,
        # File manager, Lists, Reports) replace their bare tag pass-through
        # so they get subsections / availability tags. Every other tag
        # stays a bare pass-through, in its original declared order, so
        # position and default contents are untouched.
        layout:
          - root
          - account-exports
          - activity-feed
          - section: Audiences
            availability: beta
            contents:
              # SPIKE 3: `summary:` directly on this section hijacked the
              # API Reference root view (see spike 2 notes). Testing whether
              # nesting a single-item subsection instead keeps the
              # disclaimer scoped to Audiences without the collision.
              - section: Contacts
                summary: ../docs/pages/concepts/audiences/contacts-overview.mdx
                contents:
                  - GET /3.0/audiences/{audience_id}/contacts
                  - POST /3.0/audiences/{audience_id}/contacts
                  - GET /3.0/audiences/{audience_id}/contacts/{contact_id}
                  - PATCH /3.0/audiences/{audience_id}/contacts/{contact_id}
                  - POST /3.0/audiences/{audience_id}/contacts/{contact_id}/actions/archive
                  - POST /3.0/audiences/{audience_id}/contacts/{contact_id}/actions/forget
          - authorized-apps
          - section: Automations
            contents:
              - GET /3.0/automations
              - POST /3.0/automations
              - GET /3.0/automations/{workflow_id}
              - POST /3.0/automations/{workflow_id}/actions/archive
              - POST /3.0/automations/{workflow_id}/actions/pause-all-emails
              - POST /3.0/automations/{workflow_id}/actions/start-all-emails
              - section: Emails
                contents:
                  - GET /3.0/automations/{workflow_id}/emails
                  - GET /3.0/automations/{workflow_id}/emails/{workflow_email_id}
                  - PATCH /3.0/automations/{workflow_id}/emails/{workflow_email_id}
                  - DELETE /3.0/automations/{workflow_id}/emails/{workflow_email_id}
                  - POST /3.0/automations/{workflow_id}/emails/{workflow_email_id}/actions/pause
                  - POST /3.0/automations/{workflow_id}/emails/{workflow_email_id}/actions/start
                  - section: Queue
                    contents:
                      - GET /3.0/automations/{workflow_id}/emails/{workflow_email_id}/queue
                      - POST /3.0/automations/{workflow_id}/emails/{workflow_email_id}/queue
                      - GET /3.0/automations/{workflow_id}/emails/{workflow_email_id}/queue/{subscriber_hash}
              - section: Removed subscribers
