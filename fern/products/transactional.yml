# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/product-yml.schema.json

# Header tabs (docs.yml layout.tabs-placement: header): Overview / Guides /
# Documentation / API Reference. Slugs on tab definitions preserve URLs
# (/transactional, /transactional/guides/*, /transactional/docs/*, /transactional/api/*).
tabs:
  overview:
    display-name: Overview
    skip-slug: true
    # Hidden for the same reason as the Marketing API's Overview tab: its page
    # is the product landing at /transactional, so the sidebar entry sent
    # readers out of the docs. The tab definition (and its slug) stay so the
    # URL keeps resolving and re-showing it is a one-line change.
    hidden: true
  guides:
    display-name: Guides
    slug: guides
  documentation:
    display-name: Documentation
    slug: docs
  api:
    display-name: API Reference
    slug: api

navigation:
  - tab: overview
    layout:
      - page: Overview
        path: ../docs/pages/transactional/landing.mdx
        slug: ""
  - tab: guides
    layout:
      - page: Transactional API Quick Start
        path: ../docs/pages/transactional/guides/quick-start.mdx
        slug: quick-start
      - page: Send Your First Transactional Email
        path: ../docs/pages/transactional/guides/send-first-email.mdx
        slug: send-first-email
      - page: Send Your First Transactional SMS
        path: ../docs/pages/transactional/guides/send-first-sms.mdx
        slug: send-first-sms
      - page: Change Sending Behavior with the Rules Engine
        path: ../docs/pages/transactional/guides/change-behavior-rules-engine.mdx
        slug: change-behavior-rules-engine
      - page: Manage Different Users with Subaccounts
        path: ../docs/pages/transactional/guides/manage-different-users-subaccounts.mdx
        slug: manage-different-users-subaccounts
      - page: Set Up Inbound Email Processing
        path: ../docs/pages/transactional/guides/set-up-inbound-email-processing.mdx
        slug: set-up-inbound-email-processing
      - page: Track and Respond to Email Activity with Webhooks
        path: ../docs/pages/transactional/guides/track-respond-activity-webhooks.mdx
        slug: track-respond-activity-webhooks
      - page: How to Use Mailchimp's Transactional Messaging MCP
        path: ../docs/pages/transactional/guides/transactional-messaging-mcp.mdx
        slug: how-to-use-mailchimps-transactional-messaging-mcp
  - tab: documentation
    layout:
      - page: Fundamentals
        path: ../docs/pages/transactional/documentation/fundamentals.mdx
      - page: Authentication and Delivery
        path: ../docs/pages/transactional/documentation/authentication-delivery.mdx
        slug: authentication-delivery
      - page: Outbound Email
        path: ../docs/pages/transactional/documentation/outbound-email.mdx
      - page: SMTP Integration
        path: ../docs/pages/transactional/documentation/smtp-integration.mdx
      - page: Templates and Dynamic Content
        path: ../docs/pages/transactional/documentation/templates-dynamic-content.mdx
        slug: templates-dynamic-content
      - page: Tags and Metadata
        path: ../docs/pages/transactional/documentation/tags-metadata.mdx
        slug: tags-metadata
      - page: The Rules Engine
        path: ../docs/pages/transactional/documentation/rules-engine.mdx
        slug: rules-engine
      - page: Subaccounts
        path: ../docs/pages/transactional/documentation/subaccounts.mdx
      - page: Reputation and Rejections
        path: ../docs/pages/transactional/documentation/reputation-rejections.mdx
        slug: reputation-rejections
      - page: Activity and Reports
        path: ../docs/pages/transactional/documentation/activity-reports.mdx
        slug: activity-reports
      - page: Webhooks
        path: ../docs/pages/transactional/documentation/webhooks.mdx
      - page: Transactional SMS
        path: ../docs/pages/transactional/documentation/transactional-sms.mdx
  - tab: api
    layout:
      - api: API Reference
        api-name: mailchimp-transactional-openapi
        skip-slug: true
        paginated: true
        snippets:
          typescript: "@mailchimp/mailchimp-transactional"
          python: mailchimp-transactional
          go: https://github.com/fern-demo/mailchimp-transactional-go-sdk
          java: com.mailchimp:mailchimp-transactional
          csharp: Mailchimp.Transactional
          ruby: mailchimp-transactional
          php: mailchimp/transactional-sdk
