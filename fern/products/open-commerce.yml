# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/product-yml.schema.json

tabs:
  guides:
    display-name: Guides
    icon: book
  documentation:
    display-name: Documentation
    icon: house
  graphql-playground:
    display-name: GraphQL Playground
    icon: puzzle

navigation:
  - tab: guides
    layout:
      - section: Getting Started
        contents:
          - page: Open Commerce Quick Start
            path: ../docs/pages/open-commerce/guides/quick-start.mdx
            icon: fa-duotone fa-rocket
      - section: Building
        contents:
          - page: Build an API Plugin
            path: ../docs/pages/open-commerce/guides/build-api-plugin.mdx
            icon: fa-duotone fa-plug
  - tab: documentation
    layout:
      - section: Core Concepts
        contents:
          - page: Fundamentals
            path: ../docs/pages/open-commerce/documentation/fundamentals.mdx
            icon: fa-duotone fa-book-open
          - page: Plugins and Environment Variables
            path: ../docs/pages/open-commerce/documentation/plugins-environment-variables.mdx
            icon: fa-duotone fa-gear
          - page: Sharing Code Between Plugins
            path: ../docs/pages/open-commerce/documentation/sharing-code-between-plugins.mdx
            icon: fa-duotone fa-code-branch
      - section: Commerce
        contents:
          - page: Creating and Organizing Products
            path: ../docs/pages/open-commerce/documentation/creating-organizing-products.mdx
            icon: fa-duotone fa-box
          - page: Tags and Navigation
            path: ../docs/pages/open-commerce/documentation/tags-navigation.mdx
            icon: fa-duotone fa-tags
          - page: Fulfilling Orders
            path: ../docs/pages/open-commerce/documentation/fulfilling-orders.mdx
            icon: fa-duotone fa-truck
          - page: Sending Emails
            path: ../docs/pages/open-commerce/documentation/sending-emails.mdx
            icon: fa-duotone fa-envelope
      - section: Contributing
        contents:
          - page: Contributing to Open Commerce
            path: ../docs/pages/open-commerce/documentation/contribute-open-commerce.mdx
            icon: fa-duotone fa-code-pull-request
          - page: Git Formatting Conventions
            path: ../docs/pages/open-commerce/documentation/git-formatting-conventions.mdx
            icon: fa-duotone fa-code-commit
          - page: Testing Requirements
            path: ../docs/pages/open-commerce/documentation/testing-requirements.mdx
            icon: fa-duotone fa-flask
  - tab: graphql-playground
    layout:
      - section: GraphQL Playground
        contents:
          - page: GraphQL Playground
            path: ../docs/pages/open-commerce/graphql-playground.mdx
