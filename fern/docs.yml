# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: mailchimp.docs.buildwithfern.com
    custom-domain: mailchimp.ferndocs.com
    edit-this-page:
      github:
        owner: fern-support
        repo: mailchimp
        branch: main
      launch: dashboard

title: Mailchimp | Developer
metadata:
  og:site_name: Mailchimp Developer
  og:title: Mailchimp Developer Documentation
  og:description: >-
    Find all the Mailchimp API documentation and tools developers need to send
    marketing and transactional emails.
  og:locale: en_US
  twitter:title: Mailchimp Developer Documentation
  twitter:description: >-
    Find all the Mailchimp API documentation and tools developers need to send
    marketing and transactional emails.

ai-search:
  location:
    - docs
ai-examples:
  enabled: false

landing-page:
  page: Welcome
  path: docs/pages/landing-page.mdx
  slug: ""

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

logo:
  light: ./assets/mc-logo-mobile-dark.svg
  dark: ./assets/mailchimp-logo-dark-bg.svg
  height: 40
  href: /

favicon: docs/assets/favicon.png

typography:
  headingsFont:
    name: Means Web
    paths:
      - path: docs/assets/fonts/Means-Light-Web.woff2
        weight: 400
  bodyFont:
    name: Graphik Web
    paths:
      - path: docs/assets/fonts/Graphik-Regular-Web.woff2
        weight: 400
      - path: docs/assets/fonts/Graphik-Medium-Web.woff2
        weight: 500
  codeFont:
    name: Input Mono Regular
    path: docs/assets/fonts/Input-Mono-Regular.woff2

colors:
  accent-primary:
    dark: "#E7B75F"
    light: "#007C89"
  background:
    dark: "#001D28"
    light: "#EFEEEA"
  sidebar-background:
    dark: "#0C2832"
  header-background:
    dark: "#0C2832"
  card-background:
    dark: "#0C2832"
    light: "#FFFFFF"
  border:
    dark: "#18323B"

css: docs/assets/styles.css

navbar-links:
  - type: minimal
    text: Tools
    url: https://mailchimp.com/developer/tools/
  - type: minimal
    text: Release Notes
    url: https://mailchimp.com/developer/release-notes/
  - type: minimal
    text: Blog
    url: https://mailchimp.com/developer/blog/
  - type: filled
    text: Sign Up
    url: https://login.mailchimp.com/signup/

products:
  - display-name: Home
    href: /
    icon: fa-duotone fa-house
  - display-name: Mailchimp Marketing API
    path: ./products/marketing-api.yml
    icon: fa-duotone fa-bullhorn
    slug: marketing
    subtitle: Power timely, relevant marketing campaigns with custom data pulled directly from your app.
  - display-name: Mailchimp Transactional
    path: ./products/transactional.yml
    icon: fa-duotone fa-envelope
    slug: transactional
    subtitle: Send targeted and event-driven messages to anyone, fast—with best-in-class deliverability.
  - display-name: Mailchimp Open Commerce
    path: ./products/open-commerce.yml
    icon: fa-duotone fa-cart-shopping
    slug: open-commerce
    subtitle: Control your commerce future with a modular, API-first commerce stack.

footer: ./components/Footer.tsx

theme:
  footer-nav: minimal
