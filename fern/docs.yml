    text: Tools
    url: /developer/tools
  - type: minimal
    text: Release Notes
    url: /developer/release-notes
  - type: filled
    text: Sign Up
    url: https://login.mailchimp.com/signup/

products:
  - display-name: Mailchimp Marketing API
    path: ./products/marketing-api.yml
    slug: marketing
    subtitle: Power timely, relevant marketing campaigns with custom data pulled directly from your app.
  - display-name: Mailchimp Transactional
    path: ./products/transactional.yml
    slug: transactional
    subtitle: Send targeted and event-driven messages to anyone, fast—with best-in-class deliverability.
  - display-name: Tools
    path: ./products/tools.yml
    slug: tools
    subtitle: Official client libraries and mobile SDKs for the Mailchimp APIs.
  - display-name: Release Notes
    path: ./products/release-notes.yml
    slug: release-notes
    subtitle: The latest updates, improvements, and fixes across the Mailchimp APIs.
  - display-name: Blog
    path: ./products/blog.yml
    slug: blog
    subtitle: Engineering stories and updates from the Mailchimp developer team.
  - display-name: Integration Partner Program
    path: ./products/integration-partner-program.yml
    slug: integration-partner-program
    subtitle: Grow your Mailchimp integration with exclusive partner benefits.

# Redirects for the 2026-08-21 Marketing API docs reorganization.
# See notes/proposed-ia.md for the full mapping.
redirects:
  - source: /developers/changelog
    destination: /developer/release-notes
  # fundamentals.mdx was split across five destinations; API structure is the
  # closest successor and both landing pages linked here as "Documentation".
  - source: /marketing/docs/fundamentals
    destination: /marketing/api-concepts/api-structure
  - source: /marketing/docs/methods-parameters
    destination: /marketing/api-concepts/methods-and-parameters
  - source: /marketing/docs/errors
    destination: /marketing/api-concepts/errors
  - source: /marketing/docs/alternative-schemas
    destination: /marketing/api-concepts/alternative-schemas
  - source: /marketing/docs/audiences-introduction
    destination: /marketing/api-concepts/audiences-endpoints-beta
  - source: /marketing/docs/merge-fields
    destination: /marketing/concepts/audiences/merge-fields
  - source: /marketing/docs/e-commerce
    destination: /marketing/concepts/e-commerce
  # build-an-integration.mdx deleted 2026-08-24 (it was a table of contents
  # pointing at pages that cover each topic properly). Old URL now lands on
  # the OAuth app walkthrough, the closest live equivalent.
  - source: /marketing/docs/integrations
    destination: /marketing/build/start-developing/set-up-an-oauth-app
  - source: /marketing/docs/mobile-sdk
    destination: /marketing/build/start-developing/mobile-sdk
  - source: /marketing/docs/account-exports
    destination: /marketing/build/start-developing/account-exports

  # Guides tab dissolved. Mechanism guides moved to API core concepts.
  - source: /marketing/guides/quick-start
    destination: /marketing/build/start-developing/send-your-first-api-request
  # v6 auth reorg: the old guide WAS the implementation walkthrough, so it
  # retargets to the task page, not the concept page.
  - source: /marketing/guides/access-user-data-oauth-2
    destination: /marketing/build/start-developing/set-up-an-oauth-app
  - source: /marketing/guides/sync-audience-data-webhooks
    destination: /marketing/api-concepts/webhooks
  - source: /marketing/guides/run-async-requests-batch-endpoint
    destination: /marketing/api-concepts/batch-operations
  - source: /marketing/guides/organize-contacts-with-tags
    destination: /marketing/build/quickstarts/organize-contacts-with-tags
  - source: /marketing/guides/mobile-sdk
    destination: /marketing/build/start-developing/mobile-sdk

  # Concepts nested under Audiences to mirror the data model.
  - source: /marketing/concepts/merge-fields
    destination: /marketing/concepts/audiences/merge-fields
  - source: /marketing/concepts/tags-and-segments
    destination: /marketing/concepts/audiences/contacts
  - source: /marketing/concepts/audiences-and-contacts
    destination: /marketing/concepts/audiences
  # docs/merge-fields now lands in the nested location.
  # Deleted pages. create-audience -> the import/export quickstart that
  # replaces it (integrators build against existing audiences).
  - source: /marketing/guides/create-audience
    destination: /marketing/build/quickstarts/import-and-export-contacts
  # Also redirect the long-standing broken slug referenced from 4 pages.
  - source: /marketing/guides/create-your-first-audience
    destination: /marketing/build/quickstarts/import-and-export-contacts
  # Events guide deleted with no successor; endpoints remain in the reference.
  - source: /marketing/guides/track-outside-activity-events
    destination: /marketing
  # UI-configured feature, not API content; no successor page.
  - source: /marketing/guides/create-webhook-customer-journey-builder-campaign-manager
    destination: /marketing

  # Authentication reorganization, 2026-08-21 (v6). Authentication became a
  # section; OAuth 2 split into concept + task.
  - source: /marketing/api-concepts/oauth-2
    destination: /marketing/api-concepts/authentication/oauth-2

  # AI tools section slug shortened from the title-derived
  # `build-with-ai-tools` to `ai-tools`, 2026-09-04. The overview also moved
  # from a child page to the section landing page.
  - source: /marketing/build/build-with-ai-tools/ai-tools
    destination: /marketing/build/ai-tools
  - source: /marketing/build/build-with-ai-tools/mcp-server
    destination: /marketing/build/ai-tools/mcp-server
  - source: /marketing/build/build-with-ai-tools/agent-skills
    destination: /marketing/build/ai-tools/agent-skills
  - source: /marketing/build/build-with-ai-tools/llms-txt
    destination: /marketing/build/ai-tools/llms-txt

  # Imported from the dev-url-redirects-recommended sheet (2026-10-09 crawl),
  # verified live against mailchimp.com before import.
  - source: /404
    destination: /

  # Pre-reorg guide/docs stragglers not yet covered above.
  - source: /guides/create-your-first-audience
    destination: /marketing/build/quickstarts/import-and-export-contacts
  - source: /guides/marketing-api-quick-start
    destination: /marketing/build/start-developing/send-your-first-api-request
  - source: /guides/send-your-first-transactional-email
    destination: /transactional/guides/send-first-email
