# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: mailchimp.docs.buildwithfern.com/developer
    custom-domain:
      - mailchimp.com/developer
      - preview.developer.mailchimp.com/developer
    multi-source: true
    edit-this-page:
      github:
        owner: fern-support
        repo: mailchimp
        branch: main
      launch: dashboard

title: Mailchimp | Developer

page-actions:
  options:
    skills:
      title: Install the Mailchimp skills
      description: >-
        Agent skills that teach coding agents the parts of the Marketing API
        that are easy to get wrong. Install them into Claude Code, Cursor, or
        any agent that supports the Agent Skills specification.
      install-command: npx skills add https://mailchimp.com/developer
      skills:
        - name: run-bulk-jobs
          description: >-
            Choose between the bulk endpoints, poll a batch job without hitting
            the connection limit, and catch operations that failed inside a
            batch that reports itself finished.
          url: https://mailchimp.com/developer/.well-known/agent-skills/run-bulk-jobs/SKILL.md
        - name: set-consent-correctly
          description: >-
            Record marketing consent from a signup form, checkout, or CRM sync
            without overwriting consent a contact already gave.
          url: https://mailchimp.com/developer/.well-known/agent-skills/set-consent-correctly/SKILL.md
        - name: set-up-oauth
          description: >-
            Implement the Mailchimp OAuth 2 flow, validate the state parameter,
            and store access tokens per connected account.
          url: https://mailchimp.com/developer/.well-known/agent-skills/set-up-oauth/SKILL.md
        - name: subscribe-to-webhooks
          description: >-
            Create a webhook, verify delivery signatures, and keep a handler
            idempotent without echoing your own writes back into the audience.
          url: https://mailchimp.com/developer/.well-known/agent-skills/subscribe-to-webhooks/SKILL.md
