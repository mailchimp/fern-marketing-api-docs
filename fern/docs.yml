# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: mailchimp.docs.buildwithfern.com
    custom-domain: mailchimp.ferndocs.com
    edit-this-page:
      github:
        owner: fern-support
        repo: mailchimp
        branch: main
      launch: dashboard

title: Mailchimp | Developer
metadata:
  og:site_name: Mailchimp Developer
  og:title: Mailchimp Developer Documentation
  og:description: >-
    Find all the Mailchimp API documentation and tools developers need to send
    marketing and transactional emails.
  og:locale: en_US
  twitter:title: Mailchimp Developer Documentation
  twitter:description: >-
    Find all the Mailchimp API documentation and tools developers need to send
    marketing and transactional emails.

ai-search:
  location:
    - docs
ai-examples:
  enabled: false

landing-page:
  page: Welcome
  path: docs/pages/landing-page.mdx
  slug: ""

layout:
  searchbar-placement: header
  page-width: 88rem
  content-width: 46rem
  tabs-placement: header

logo:
  light: ./assets/mc-logo-mobile-dark.svg
  dark: ./assets/mailchimp-logo-twotone-dark.svg
  height: 40
  href: /

favicon: docs/assets/favicon.png

typography:
  headingsFont:
    name: Means Web
    paths:
      - path: docs/assets/fonts/Means-Light-Web.woff2
        weight: 400
  bodyFont:
    name: Graphik Web
    paths:
      - path: docs/assets/fonts/Graphik-Regular-Web.woff2
        weight: 400
      - path: docs/assets/fonts/Graphik-Medium-Web.woff2
        weight: 500
  codeFont:
    name: Input Mono Regular
    path: docs/assets/fonts/Input-Mono-Regular.woff2

colors:
  accent-primary:
    dark: "#E7B75F"
    light: "#007C89"
  background:
    dark: "#001D28"
    light: "#EFEEEA"
  sidebar-background:
    dark: "#001D28"
    light: "#EFEEEA"
  header-background:
    dark: "#0C2832"
  card-background:
    dark: "#0C2832"
    light: "#FFFFFF"
  border:
    dark: "#18323B"

css: docs/assets/styles.css

js:
  - path: docs/assets/mc-sidebar-toc.js
    strategy: afterInteractive
  - path: docs/assets/mc-blog.js
    strategy: afterInteractive
  - path: docs/assets/mc-carousel.js
    strategy: afterInteractive
  - path: docs/assets/mc-header.js
    strategy: afterInteractive
  - path: docs/assets/mc-sidebar-product-title.js
    strategy: afterInteractive

navbar-links:
  - type: minimal
    text: Tools
    url: /tools
  - type: minimal
    text: Release Notes
    url: /release-notes
  - type: minimal
    text: Blog
    url: /blog
  - type: filled
    text: Sign Up
    url: https://login.mailchimp.com/signup/

products:
  - display-name: Mailchimp Marketing API
    path: ./products/marketing-api.yml
    slug: marketing
    subtitle: Power timely, relevant marketing campaigns with custom data pulled directly from your app.
  - display-name: Mailchimp Transactional
    path: ./products/transactional.yml
    slug: transactional
    subtitle: Send targeted and event-driven messages to anyone, fast—with best-in-class deliverability.
  - display-name: Tools
    path: ./products/tools.yml
    slug: tools
    subtitle: Official client libraries and mobile SDKs for the Mailchimp APIs.
  - display-name: Release Notes
    path: ./products/release-notes.yml
    slug: release-notes
    subtitle: The latest updates, improvements, and fixes across the Mailchimp APIs.
  - display-name: Blog
    path: ./products/blog.yml
    slug: blog
    subtitle: Engineering stories and updates from the Mailchimp developer team.

footer: ./components/Footer.tsx

theme:
  footer-nav: minimal
