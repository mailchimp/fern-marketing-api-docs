  dark: ./assets/mailchimp-logo-twotone-dark.svg
  height: 40
  href: /developer

favicon: docs/assets/favicon.png

typography:
  headingsFont:
    name: Means Web
    paths:
      - path: docs/assets/fonts/Means-Light-Web.woff2
        weight: 400
  bodyFont:
